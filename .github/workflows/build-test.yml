name: Build test

env:
  REGISTRY_IMAGE: ghcr.io/fyralabs/katsu

on:
  push:

jobs:
  # Build docker image for the rest of the tests
  build-environment-arch:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      packages: write
    steps:
      - name: Prepare
        id: prepare
        run: |
          platform=${{ matrix.platform }}
          platform_pair=${platform//\//-}
          echo "PLATFORM_PAIR=$platform_pair" >> $GITHUB_ENV
          echo "platform_pair=$platform_pair" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build OCI test cache by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.prepare.outputs.platform_pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  build-environment:
    runs-on: ubuntu-latest
    needs:
      - build-environment-arch
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
              $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}

  image-arm:
    needs: build-environment
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/fyralabs/katsu:${{ github.ref_name || 'latest' }}
      # Pass /dev from host to container
      # Very hacky, but it works
      # Microsoft/Github, if you're reading this,
      # I'm sorry.
      options: --privileged -v /dev:/dev

    steps:
      - uses: actions/checkout@v4

      - name: Run test
        run: |
          export PATH=$HOME/.cargo/bin:$PATH
          export KATSU_KEEP_CHROOT=1
          pushd tests/ng
          echo "COLORBT_SHOW_HIDDEN=1" >> .env
          echo "KATSU_LOG=trace" >> .env
          katsu -o disk-image katsu-arm.yaml 2>&1
          zstd -19 katsu-work/image/katsu.img -c > katsu-work/image/katsu-arm.raw.zstd
          popd

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-arm
          path: tests/ng/katsu-work/image/*.raw.zstd

  bios-x86_64:
    needs: build-environment
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fyralabs/katsu:${{ github.ref_name || 'latest' }}
      # Pass /dev from host to container
      # Very hacky, but it works
      # Microsoft/Github, if you're reading this,
      # I'm sorry.
      options: --privileged -v /dev:/dev

    steps:
      - uses: actions/checkout@v4


      - name: Run test
        run: |
          export PATH=$HOME/.cargo/bin:$PATH
          export KATSU_KEEP_CHROOT=1
          pushd tests/ng
          echo "COLORBT_SHOW_HIDDEN=1" >> .env
          echo "KATSU_LOG=trace" >> .env
          katsu -o disk-image katsu-bios.yaml 2>&1
          zstd -19 katsu-work/image/katsu.img -c > katsu-work/image/katsu.raw.zstd
          popd

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bios-x86_64
          path: tests/ng/katsu-work/image/*.raw.zstd

  image-x86_64:
    needs: build-environment
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fyralabs/katsu:${{ github.ref_name || 'latest' }}
      # Pass /dev from host to container
      # Very hacky, but it works
      # Microsoft/Github, if you're reading this,
      # I'm sorry.
      options: --privileged -v /dev:/dev

    steps:
      - uses: actions/checkout@v4

      - name: Run test
        run: |
          export PATH=$HOME/.cargo/bin:$PATH
          export KATSU_KEEP_CHROOT=1
          pushd tests/ng
          echo "COLORBT_SHOW_HIDDEN=1" >> .env
          echo "KATSU_LOG=trace" >> .env
          katsu -o disk-image katsu.yaml 2>&1
          zstd -19 katsu-work/image/katsu.img -c > katsu-work/image/katsu.raw.zstd
          popd

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-x86_64
          path: tests/ng/katsu-work/image/*.raw.zstd

  iso-x86_64:
    needs: build-environment
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fyralabs/katsu:${{ github.ref_name || 'latest' }}
      # Pass /dev from host to container
      # Very hacky, but it works
      # Microsoft/Github, if you're reading this,
      # I'm sorry.
      options: --privileged -v /dev:/dev

    steps:
      - uses: actions/checkout@v4

      - name: Run test
        run: |
          export PATH=$HOME/.cargo/bin:$PATH
          export KATSU_KEEP_CHROOT=1
          pushd tests/ng
          echo "COLORBT_SHOW_HIDDEN=1" >> .env
          echo "KATSU_LOG=trace" >> .env
          katsu -o iso katsu-iso.yaml 2>&1
          mv out.iso katsu-work/image/katsu.iso
          popd

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iso-x86_64
          path: tests/ng/katsu-work/image/katsu.iso

  # Native composefs unified storage. The payload holds a bootc-owned
  # containers-storage next to the composefs objects, the system boots via
  # `composefs=`, and that store doubles as an offline install source for
  # `bootc install --source-imgref containers-storage:<image>`.
  iso-bootc-x86_64:
    needs: build-environment
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fyralabs/katsu:${{ github.ref_name || 'latest' }}
      # Pass /dev from host to container
      # Very hacky, but it works
      # Microsoft/Github, if you're reading this,
      # I'm sorry.
      #
      # `bootc install` mirrors /dev, /var/lib/containers, /var/tmp and /run/udev
      # from the host and compares each against /proc/1/root/<path>, so all four
      # must exist at the same path inside the container. Without /run/udev in
      # particular it fails with "Comparing filesystems at /run/udev ...".
      options: --privileged --security-opt seccomp=unconfined -v /dev:/dev -v /run/udev:/run/udev -v /var/tmp:/var/tmp -v /var/lib/containers:/var/lib/containers -v /usr:/hostusr -v /:/hostfs

    steps:
      - uses: actions/checkout@v4
      - name: Clean up space before build
        run: |
          df -h
          # Wipe stuff in our host /usr to make some space

          # We don't need the android SDK
          rm -rf /hostusr/local/lib/android
          # We're a Rust shop, not a Haskell shop
          rm -rf /hostusr/local/.ghcup
          rm -rf /hostfs/opt/ghc
          # We don't even use .NET
          rm -rf /hostusr/share/dotnet
          # We don't need CodeQL in this action
          rm -rf /hostfs/opt/hostedtoolcache/CodeQL

      - name: Run test
        run: |
          export PATH=$HOME/.cargo/bin:$PATH
          export KATSU_KEEP_CHROOT=1
          pushd tests/ng
          echo "COLORBT_SHOW_HIDDEN=1" >> .env
          echo "KATSU_LOG=trace" >> .env
          katsu -o iso bootc/katsu-iso-bootc.yaml 2>&1
          mv out.iso katsu-work/image/katsu.iso
          popd

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iso-bootc-x86_64
          path: tests/ng/katsu-work/image/katsu.iso

  iso-bootc-x86_64-comptest:
    strategy:
      fail-fast: false
      matrix:
        compression:
          - zstd
          - lzma
          - xz
        level:
          - "6"
        pcluster_size:
          - 1048576
          - 131072
        # `fragdedupe` accepts only `inode` or `full`; there is no `all` value.
        # `full` compares every fragment's content and is known to OOM a large
        # tree, so it rides in the dedicated latency job instead.
        fragdedupe:
          - inode

    needs: build-environment
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fyralabs/katsu:${{ github.ref_name || 'latest' }}
      # Pass /dev from host to container
      # Very hacky, but it works
      # Microsoft/Github, if you're reading this,
      # I'm sorry.
      #
      # `bootc install` mirrors /dev, /var/lib/containers, /var/tmp and /run/udev
      # from the host and compares each against /proc/1/root/<path>, so all four
      # must exist at the same path inside the container. Without /run/udev in
      # particular it fails with "Comparing filesystems at /run/udev ...".
      options: --privileged --security-opt seccomp=unconfined -v /dev:/dev -v /run/udev:/run/udev -v /var/tmp:/var/tmp -v /var/lib/containers:/var/lib/containers -v /usr:/hostusr -v /:/hostfs

    steps:
      - uses: actions/checkout@v4
      - name: Clean up space before build
        run: |
          df -h
          # Wipe stuff in our host /usr to make some space

          # We don't need the android SDK
          rm -rf /hostusr/local/lib/android
          # We're a Rust shop, not a Haskell shop
          rm -rf /hostusr/local/.ghcup
          rm -rf /hostfs/opt/ghc
          # We don't even use .NET
          rm -rf /hostusr/share/dotnet
          # We don't need CodeQL in this action
          rm -rf /hostfs/opt/hostedtoolcache/CodeQL

      - name: Run test
        # One comma-separated line: clap splits KATSU_FEATURE_FLAGS on `,`, so a
        # folded/multi-line value would leave leading spaces on later flags and
        # they would silently not apply. The compression level is its own flag for
        # the same reason: `zstd,level=6` would be split and the level dropped.
        env:
          KATSU_FEATURE_FLAGS: erofs-compression=${{ matrix.compression }},erofs-compression-level=${{ matrix.level }},erofs-chunk-size=${{ matrix.pcluster_size }},erofs-fragdedupe=${{ matrix.fragdedupe }}
        run: |
          export PATH=$HOME/.cargo/bin:$PATH
          export KATSU_KEEP_CHROOT=1
          pushd tests/ng
          echo "COLORBT_SHOW_HIDDEN=1" >> .env
          echo "KATSU_LOG=trace" >> .env

          start=$(date +%s)
          katsu -o iso bootc/katsu-iso-bootc.yaml 2>&1
          elapsed=$(( $(date +%s) - start ))

          mv out.iso katsu-work/image/katsu.iso
          bytes=$(stat -c %s katsu-work/image/katsu.iso)
          human=$(numfmt --to=iec --suffix=B "$bytes")
          # The payload dominates the ISO and is what the EROFS settings actually
          # shape, so report it separately: two configurations can produce the same
          # ISO size while compressing the payload very differently.
          payload_bytes=$(stat -c %s katsu-work/iso-tree/LiveOS/rootfs.img)
          payload_human=$(numfmt --to=iec --suffix=B "$payload_bytes")
          popd

          # This job exists to compare size and build cost across the matrix, so
          # surface both in the summary instead of requiring every artifact to be
          # downloaded and measured by hand.
          {
            echo "### EROFS compression test"
            echo
            echo "| compression | level | chunk size | fragdedupe | payload | ISO size | build time |"
            echo "|---|---|---|---|---|---|---|"
            echo "| \`${{ matrix.compression }}\` | ${{ matrix.level }} | ${{ matrix.pcluster_size }} | ${{ matrix.fragdedupe }} | $payload_human ($payload_bytes bytes) | $human ($bytes bytes) | ${elapsed}s |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iso-bootc-comptest-${{ matrix.compression }}-${{ matrix.level }}-${{ matrix.pcluster_size }}-${{ matrix.fragdedupe }}
          path: tests/ng/katsu-work/image/katsu.iso
          # The whole point of this job is measuring size; a silently empty or
          # truncated upload would invalidate the comparison.
          if-no-files-found: error


  # The shipped defaults trade some size for live read latency: `fragments`
  # instead of `all-fragments`, 128KiB physical clusters instead of 1MiB, and
  # per-path hints for kernel modules and shared libraries. This job measures
  # that tradeoff against the previous defaults so the choice stays evidenced
  # rather than assumed. `fragdedupe=full` rides along because it is the one
  # setting known to OOM a large tree and must not land in the main matrix.
  iso-bootc-x86_64-latency:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            fragments: fragments
            pcluster_size: 131072
            compress_hints: live
          - name: size-max
            fragments: all-fragments
            pcluster_size: 1048576
            compress_hints: none
          - name: no-hints
            fragments: fragments
            pcluster_size: 131072
            compress_hints: none
          - name: fragdedupe-full
            fragments: fragments
            pcluster_size: 131072
            compress_hints: live
            fragdedupe: full

    needs: build-environment
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fyralabs/katsu:${{ github.ref_name || 'latest' }}
      # Same host passthrough requirements as the compression matrix above.
      options: --privileged --security-opt seccomp=unconfined -v /dev:/dev -v /run/udev:/run/udev -v /var/tmp:/var/tmp -v /var/lib/containers:/var/lib/containers -v /usr:/hostusr -v /:/hostfs

    steps:
      - uses: actions/checkout@v4
      - name: Clean up space before build
        run: |
          df -h
          rm -rf /hostusr/local/lib/android
          rm -rf /hostusr/local/.ghcup
          rm -rf /hostfs/opt/ghc
          rm -rf /hostfs/usr/share/dotnet
          rm -rf /hostfs/opt/hostedtoolcache/CodeQL

      - name: Run test
        # One comma-separated line: clap splits KATSU_FEATURE_FLAGS on `,`, so a
        # folded/multi-line value would leave leading spaces on later flags and
        # they would silently not apply.
        env:
          KATSU_FEATURE_FLAGS: erofs-compression=zstd,erofs-compression-level=6,erofs-chunk-size=${{ matrix.pcluster_size }},erofs-fragments=${{ matrix.fragments }},erofs-compress-hints=${{ matrix.compress_hints }}${{ matrix.fragdedupe && format(',erofs-fragdedupe={0}', matrix.fragdedupe) || '' }}
        run: |
          export PATH=$HOME/.cargo/bin:$PATH
          export KATSU_KEEP_CHROOT=1
          pushd tests/ng
          echo "COLORBT_SHOW_HIDDEN=1" >> .env
          echo "KATSU_LOG=trace" >> .env

          start=$(date +%s)
          katsu -o iso bootc/katsu-iso-bootc.yaml 2>&1
          elapsed=$(( $(date +%s) - start ))

          mv out.iso katsu-work/image/katsu.iso
          bytes=$(stat -c %s katsu-work/image/katsu.iso)
          human=$(numfmt --to=iec --suffix=B "$bytes")
          payload_bytes=$(stat -c %s katsu-work/iso-tree/LiveOS/rootfs.img)
          payload_human=$(numfmt --to=iec --suffix=B "$payload_bytes")
          popd

          {
            echo "### EROFS read-latency test"
            echo
            echo "| variant | fragments | pcluster | hints | payload | ISO size | build time |"
            echo "|---|---|---|---|---|---|---|"
            echo "| \`${{ matrix.name }}\` | \`${{ matrix.fragments }}\` | ${{ matrix.pcluster_size }} | \`${{ matrix.compress_hints }}\` | $payload_human ($payload_bytes bytes) | $human ($bytes bytes) | ${elapsed}s |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iso-bootc-latency-${{ matrix.name }}
          path: tests/ng/katsu-work/image/katsu.iso
          if-no-files-found: error


  iso-refind-x86_64:
    needs: build-environment
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fyralabs/katsu:${{ github.ref_name || 'latest' }}
      # Pass /dev from host to container
      # Very hacky, but it works
      # Microsoft/Github, if you're reading this,
      # I'm sorry.
