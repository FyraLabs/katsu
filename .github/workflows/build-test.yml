    steps:
      - uses: actions/checkout@v4


      - name: Run test
        run: |
          export PATH=$HOME/.cargo/bin:$PATH
          export KATSU_KEEP_CHROOT=1
          pushd tests/ng
          echo "COLORBT_SHOW_HIDDEN=1" >> .env
          echo "KATSU_LOG=trace" >> .env
