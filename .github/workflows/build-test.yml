    steps:
      - uses: actions/checkout@v4

      - name: Run test
        run: |
          export PATH=$HOME/.cargo/bin:$PATH
          export KATSU_KEEP_CHROOT=1
          pushd tests/ng
          echo "COLORBT_SHOW_HIDDEN=1" >> .env
          echo "KATSU_LOG=trace" >> .env
          katsu -o folder katsu-script-test.yaml 2>&1
          tar -cJf katsu-work/fs-test-x86_64.tar.xz katsu-work/chroot
          popd

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fs-test-x86_64
          path: tests/ng/katsu-work/fs-test-x86_64.tar.xz
          archive: false
