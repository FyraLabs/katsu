  iso-x86_64:
    needs: build-environment
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fyralabs/katsu:${{ github.ref_name || 'latest' }}
      # Pass /dev from host to container
      # Very hacky, but it works
      # Microsoft/Github, if you're reading this,
      # I'm sorry.
      options: --privileged -v /dev:/dev

    steps:
      - uses: actions/checkout@v4

      - name: Run test
        run: |
          export PATH=$HOME/.cargo/bin:$PATH
          export KATSU_KEEP_CHROOT=1
          pushd tests/ng
          echo "COLORBT_SHOW_HIDDEN=1" >> .env
          echo "KATSU_LOG=trace" >> .env
          katsu -o iso katsu-iso.yaml 2>&1
          mv out.iso katsu-work/image/iso-x86_64.iso
          popd

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: iso-x86_64
          path: tests/ng/katsu-work/image/iso-x86_64.iso
          archive: false

  # Native composefs unified storage. The payload holds a bootc-owned
  # containers-storage next to the composefs objects, the system boots via
  # `composefs=`, and that store doubles as an offline install source for
  # `bootc install --source-imgref containers-storage:<image>`.
  iso-bootc-x86_64:
    needs: build-environment
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fyralabs/katsu:${{ github.ref_name || 'latest' }}
      # Pass /dev from host to container
      # Very hacky, but it works
      # Microsoft/Github, if you're reading this,
      # I'm sorry.
      #
      # `bootc install` mirrors /dev, /var/lib/containers, /var/tmp and /run/udev
      # from the host and compares each against /proc/1/root/<path>, so all four
      # must exist at the same path inside the container. Without /run/udev in
      # particular it fails with "Comparing filesystems at /run/udev ...".
      options: --privileged --security-opt seccomp=unconfined -v /dev:/dev -v /run/udev:/run/udev -v /var/tmp:/var/tmp -v /var/lib/containers:/var/lib/containers -v /usr:/hostusr -v /:/hostfs

    steps:
      - uses: actions/checkout@v4
      - name: Clean up space before build
        run: |
          df -h
          # Wipe stuff in our host /usr to make some space

          # We don't need the android SDK
          rm -rf /hostusr/local/lib/android
          # We're a Rust shop, not a Haskell shop
          rm -rf /hostusr/local/.ghcup
          rm -rf /hostfs/opt/ghc
          # We don't even use .NET
          rm -rf /hostusr/share/dotnet
          # We don't need CodeQL in this action
          rm -rf /hostfs/opt/hostedtoolcache/CodeQL

      - name: Run test
        run: |
          export PATH=$HOME/.cargo/bin:$PATH
          export KATSU_KEEP_CHROOT=1
          pushd tests/ng
          echo "COLORBT_SHOW_HIDDEN=1" >> .env
          echo "KATSU_LOG=trace" >> .env
          katsu -o iso bootc/katsu-iso-bootc.yaml 2>&1
          mv out.iso katsu-work/image/iso-bootc-x86_64.iso
          popd

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: iso-bootc-x86_64
          path: tests/ng/katsu-work/image/iso-bootc-x86_64.iso
          archive: false

  iso-refind-x86_64:
