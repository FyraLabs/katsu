    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fyralabs/katsu:${{ github.ref_name || 'latest' }}
      # Pass /dev from host to container
      # Very hacky, but it works
      # Microsoft/Github, if you're reading this,
      # I'm sorry.
      options: --privileged -v /dev:/dev

    steps:
      - uses: actions/checkout@v4


      - name: Run test
        run: |
          export PATH=$HOME/.cargo/bin:$PATH
          export KATSU_KEEP_CHROOT=1
          pushd tests/ng
          echo "COLORBT_SHOW_HIDDEN=1" >> .env
          echo "KATSU_LOG=trace" >> .env
          katsu -o disk-image katsu-bios.yaml 2>&1
          zstd -19 katsu-work/image/katsu.img -c > katsu-work/image/bios-x86_64.raw.zstd
          popd

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bios-x86_64
          path: tests/ng/katsu-work/image/bios-x86_64.raw.zstd
          archive: false

  image-x86_64:
    needs: build-environment
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fyralabs/katsu:${{ github.ref_name || 'latest' }}
      # Pass /dev from host to container
      # Very hacky, but it works
      # Microsoft/Github, if you're reading this,
      # I'm sorry.
      options: --privileged -v /dev:/dev

    steps:
      - uses: actions/checkout@v4

      - name: Run test
        run: |
          export PATH=$HOME/.cargo/bin:$PATH
          export KATSU_KEEP_CHROOT=1
          pushd tests/ng
          echo "COLORBT_SHOW_HIDDEN=1" >> .env
          echo "KATSU_LOG=trace" >> .env
